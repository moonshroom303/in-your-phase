# Baut In Your Phase (AU, VST3, App) auf einem Mac-Server von GitHub, testet und validiert die AU.
name: macOS-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: JUCE holen
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git JUCE
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Bauen
        run: cmake --build build --config Release --target InYourPhase_AU InYourPhase_VST3 InYourPhase_Standalone InYourPhaseTests -j 4
      - name: Testen
        run: ./build/InYourPhaseTests_artefacts/Release/InYourPhaseTests
      - name: AU validieren
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Iyp1 Mnsh | tee auval.txt
          grep -q "AU VALIDATION SUCCEEDED" auval.txt
      - name: Packen
        run: |
          mkdir out
          ditto "build/InYourPhase_artefacts/Release/AU/In Your Phase.component" "out/In Your Phase.component"
          ditto "build/InYourPhase_artefacts/Release/VST3/In Your Phase.vst3" "out/In Your Phase.vst3"
          ditto "build/InYourPhase_artefacts/Release/Standalone/In Your Phase.app" "out/In Your Phase.app"
          ditto -c -k --keepParent out InYourPhase-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InYourPhase-macOS
          path: InYourPhase-macOS.zip
